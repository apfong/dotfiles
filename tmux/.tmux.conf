set -g default-shell $SHELL

# macOS-only: route tmux through reattach-to-user-namespace so pbcopy works.
# Linux ignores this block.
if-shell '[ "$(uname)" = "Darwin" ]' {
  set -g default-command "reattach-to-user-namespace -l ${SHELL}"
}

bind-key -T edit-mode-vi Up   send-keys -X history-up
bind-key -T edit-mode-vi Down send-keys -X history-down

unbind-key -T copy-mode-vi Space ; bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi Enter
unbind-key -T copy-mode-vi C-v   ; bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi [     ; bind-key -T copy-mode-vi [   send-keys -X begin-selection
unbind-key -T copy-mode-vi ]     ; bind-key -T copy-mode-vi ]   send-keys -X copy-selection

# OS-aware copy on highlight
if-shell '[ "$(uname)" = "Darwin" ]' {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
  bind C-p run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"
  bind C-y run "tmux show-buffer | pbcopy"
} {
  # Linux: prefer xclip if present; fall back to no-op pipe.
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i 2>/dev/null"
  bind C-p run "tmux set-buffer \"$(xclip -selection clipboard -o 2>/dev/null)\"; tmux paste-buffer"
  bind C-y run "tmux show-buffer | xclip -selection clipboard -i 2>/dev/null"
}

bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Smart pane switching with awareness of Vim splits.
# https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h  if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j  if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k  if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l  if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

set-option -g mouse on
set-option -g history-limit 10000

# Plugins (tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'fullscreen'
set -g @resurrect-processes 'ssh psql mysql'

set -g prefix C-b
bind-key C-b send-prefix

# Open new panes/windows in the current directory
bind c new-window      -c "#{pane_current_path}"
bind '"' split-window  -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"

setw -g mode-keys vi
set -g default-terminal "xterm-256color"

# Auto-install tpm
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep tpm init at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
